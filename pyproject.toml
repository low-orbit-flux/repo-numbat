[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-numbat"
version = "0.1.0"
description = "Desktop dashboard showing the git status of every repository under ~/repos"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
icons = ["Pillow"]

[project.scripts]
repo-numbat = "repo_numbat.cli:main"

[project.gui-scripts]
repo-numbat-gui = "repo_numbat.cli:main"

[tool.setuptools.packages.find]
include = ["repo_numbat*"]

[tool.setuptools.package-data]
repo_numbat = ["assets/*"]
